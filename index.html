<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <video autoplay muted loop playsinline class="bg-video">
        <source src="minecraft-bg.mp4" type="video/mp4">
    </video>

    <button id="chestButton"><img src="chest.png" alt="Chest" class="chest-popup"></button>

    <div id="closed-scroll" class="loot">
        <button id="closedScrollButton"><img src="closed-scroll.png" alt="Closed scroll" class="chest-item"></button>
    </div>

    <div id="scroll" class="loot">
        <button id="scrollButton" class="scroll-wrap">
            <img src="scroll.png" alt="Scroll" class="chest-item">
            <p class="scroll-text">
                Hi Luca! I figured I'd keep you posted on my antics 
                while you're recovering, and I wanted to do it in a way that might 
                make you smile. 
            </p>
        </button>
    </div>

    <div id="stories" class="loot stories">
        <button id="story1"><img src="scroll.png" class="chest-item"></button>
        <button id="story2"><img src="scroll.png" class="chest-item"></button>
        <button id="story3"><img src="scroll.png" class="chest-item"></button>
        <button id="story4"><img src="scroll.png" class="chest-item"></button>
        <button id="story5"><img src="scroll.png" class="chest-item"></button>
    </div>

    <div id="story1-scroll" class="loot">
        <div class="scroll-page">
            <div class="scroll-wrap">
                <img src="scroll.png" alt="Scroll" class="chest-item">
                <div class="scroll-text scrollable">Story 1 text goes here.</div>
            </div>
            <button class="home-button">Home</button>
        </div>
    </div>

    <div id="story2-scroll" class="loot">
        <div class="scroll-page">
            <div class="scroll-wrap">
                <img src="scroll.png" alt="Scroll" class="chest-item">
                <div class="scroll-text scrollable">Story 2 text goes here.</div>
            </div>
            <button class="home-button">Home</button>
        </div>
    </div>

    <div id="story3-scroll" class="loot">
        <div class="scroll-page">
            <div class="scroll-wrap">
                <img src="scroll.png" alt="Scroll" class="chest-item">
                <div class="scroll-text scrollable">Story 3 text goes here.</div>
            </div>
            <button class="home-button">Home</button>
        </div>
    </div>

    <div id="story4-scroll" class="loot">
        <div class="scroll-page">
            <div class="scroll-wrap">
                <img src="scroll.png" alt="Scroll" class="chest-item">
                <div class="scroll-text scrollable">Story 4 text goes here.</div>
            </div>
            <button class="home-button">Home</button>
        </div>
    </div>

    <div id="story5-scroll" class="loot">
        <div class="scroll-page">
            <div class="scroll-wrap">
                <img src="scroll.png" alt="Scroll" class="chest-item">
                <div class="scroll-text scrollable">Story 5 text goes here.</div>
            </div>
            <button class="home-button">Home</button>
        </div>
    </div>

    <script src="pizzazz.js"></script>
</body>
</html>
